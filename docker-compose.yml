services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accumulation
      POSTGRES_USER: accumulation
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accumulation -d accumulation"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      RAW_ROOT: /data/raw
      FINMIND_API_TOKEN: $${FINMIND_API_TOKEN:-}
      APP_ENV: production
      TZ: Asia/Taipei
    env_file:
      - path: .env
        required: false
    secrets:
      - postgres_password
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - raw_data:/data/raw
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      RAW_ROOT: /data/raw
      FINMIND_API_TOKEN: $${FINMIND_API_TOKEN:-}
      APP_ENV: production
      TZ: Asia/Taipei
    env_file:
      - path: .env
        required: false
    secrets:
      - postgres_password
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - raw_data:/data/raw
    networks: [internal]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-18080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend: {condition: service_started}
      api: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  postgres_data:
  raw_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password

networks:
  internal:
    driver: bridge
    internal: true
